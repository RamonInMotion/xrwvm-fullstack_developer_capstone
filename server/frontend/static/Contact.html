<html>
<head>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<div>
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
    <div class="container-fluid">
      <h2 style="padding-right: 5%;">Dealerships</h2>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" style="font-size: larger;" href="/contact">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="card" style="width: 80%;margin: auto; margin-top:5%; padding: 30px;">
    <h1 style="text-align:center; color:darkblue;">Contact Us</h1>
    <div style="display: flex; flex-direction: row; margin-top: 20px;">
      <div style="width: 50%; padding: 20px;">
        <h3>Get In Touch</h3>
        <form>
          <div style="margin-bottom: 15px;">
            <label for="name" style="display:block; margin-bottom:5px;">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div style="margin-bottom: 15px;">
            <label for="email" style="display:block; margin-bottom:5px;">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div style="margin-bottom: 15px;">
            <label for="message" style="display:block; margin-bottom:5px;">Message</label>
            <textarea id="message" name="message" placeholder="Your Message" rows="5" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;"></textarea>
          </div>
          <button type="submit" style="background-color:darkturquoise; color:white; padding:10px 20px; border:none; border-radius:4px; cursor:pointer; font-size:16px;">Send Message</button>
        </form>
      </div>
      <div style="width: 50%; padding: 20px;">
        <h3>Contact Information</h3>
        <p><strong>Address:</strong><br>123 Auto Drive<br>Detroit, MI 48201</p>
        <p><strong>Phone:</strong><br>(555) 123-4567</p>
        <p><strong>Email:</strong><br>info@dealership.com</p>
        <p><strong>Business Hours:</strong><br>
          Monday - Friday: 9:00 AM - 7:00 PM<br>
          Saturday: 10:00 AM - 5:00 PM<br>
          Sunday: Closed
        </p>
        <img src="/static/contactus.png" alt="Contact Us" style="width:100%; margin-top:10px;">
      </div>
    </div>
  </div>
</div>

</html>
